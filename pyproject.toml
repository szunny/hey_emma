[project]
name = "hey-emma"
version = "0.1.0"
description = "Hey Emma - Deutscher Voice Assistant"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.15",
    "sentence-transformers[onnx]>=5.0.0",
    "onnxruntime>=1.18.0",
    "pvporcupine>=3.0.5,<4.0.0",
    "pvrecorder>=1.2.7",
    "openwakeword>=0.6.0",
    "numpy>=1.24.0",
    "pyobjc-framework-Cocoa>=11.0",
    "pyobjc-framework-Speech>=11.0",
    "pyobjc-framework-AVFoundation>=11.0",
    "pyobjc-framework-ServiceManagement>=11.0",
    "python-dotenv>=1.0.0",
    "psutil>=7.0.0",
    "pyyaml>=6.0",
    "docker>=7.1.0",
]

[project.scripts]
hey-emma = "emma.main:main"
hey-emma-gui = "emma.menubar:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
